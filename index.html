<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Permintaan Forklift</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <!-- Container Utama -->
    <div class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Header -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 flex flex-col md:flex-row justify-between items-center border-b-4 border-blue-600">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-3">
                    <i class="fa-solid fa-truck-ramp-box text-blue-600"></i> Aplikasi Permintaan Forklift
                </h1>
                <p class="text-sm text-gray-500 mt-1">Sistem pencatatan dan monitoring pengangkatan material / barang</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-2">
                <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-file-excel"></i> Ekspor Excel
                </button>
                <button onclick="window.print()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-print"></i> Cetak / PDF
                </button>
            </div>
        </div>

        <!-- Statistik Ringkas -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-500 font-semibold uppercase">Total Permintaan</p>
                    <h3 id="stat-total" class="text-2xl font-bold text-gray-800 mt-1">0</h3>
                </div>
                <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-clipboard-list"></i>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-500 font-semibold uppercase">Dalam Proses</p>
                    <h3 id="stat-proses" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
                </div>
                <div class="w-10 h-10 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-clock"></i>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-500 font-semibold uppercase">Selesai</p>
                    <h3 id="stat-selesai" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
                </div>
                <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
            </div>
        </div>

        <!-- Grid Layout: Form Input & Data Tabel -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Kolom Kiri: Form Input -->
            <div class="bg-white rounded-xl shadow-md p-6 h-fit lg:sticky lg:top-6">
                <h2 id="form-title" class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-blue-600"></i> Buat Permintaan Baru
                </h2>
                
                <form id="forkliftForm" onsubmit="saveData(event)" class="space-y-4">
                    <input type="hidden" id="editIndex" value="">
                    
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Nama Pemohon</label>
                        <input type="text" id="nama" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Masukkan nama pemohon">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Section</label>
                        <input type="text" id="section" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Contoh: Logistik / Gudang">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Nomor MO</label>
                        <input type="text" id="nomorMo" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Nomor MO">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Deskripsi Permintaan</label>
                        <textarea id="deskripsi" rows="2" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Rincian barang/pekerjaan"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Lokasi Pengangkatan</label>
                        <input type="text" id="lokasi" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Asal lokasi barang">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Tujuan Pengangkatan</label>
                        <input type="text" id="tujuan" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Tujuan lokasi barang">
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="submit" id="btn-submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition shadow-sm">
                            Simpan Data
                        </button>
                        <button type="button" id="btn-cancel" onclick="resetForm()" class="hidden bg-gray-300 hover:bg-gray-400 text-gray-700 font-medium py-2 px-4 rounded-lg text-sm transition">
                            Batal
                        </button>
                    </div>
                </form>
            </div>

            <!-- Kolom Kanan: Tabel Data -->
            <div class="lg:col-span-2 bg-white rounded-xl shadow-md p-6">
                
                <!-- Filter & Pencarian -->
                <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
                    <div class="w-full sm:w-72 relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-solid fa-search text-xs"></i>
                        </span>
                        <input type="text" id="searchInput" onkeyup="renderTable()" placeholder="Cari data..." class="w-full pl-9 pr-4 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <label class="text-xs font-semibold text-gray-500 uppercase">Status:</label>
                        <select id="filterStatus" onchange="renderTable()" class="px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="ALL">Semua Status</option>
                            <option value="Proses">Dalam Proses</option>
                            <option value="Selesai">Selesai</option>
                        </select>
                    </div>
                </div>

                <!-- Tabel Responsive -->
                <div class="overflow-x-auto rounded-lg border border-gray-100">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-blue-600 text-white text-xs uppercase tracking-wider">
                                <th class="p-3 text-center w-12">No</th>
                                <th class="p-3">Nama</th>
                                <th class="p-3">Section</th>
                                <th class="p-3">Nomor MO</th>
                                <th class="p-3">Deskripsi</th>
                                <th class="p-3">Lokasi & Tujuan</th>
                                <th class="p-3 text-center">Status</th>
                                <th class="p-3 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tableData" class="divide-y divide-gray-200 text-sm">
                            <!-- Data akan di-load lewat JavaScript -->
                        </tbody>
                    </table>
                </div>

                <!-- Pesan Kosong -->
                <div id="emptyState" class="hidden text-center py-12 text-gray-400">
                    <i class="fa-solid fa-folder-open text-3xl mb-2"></i>
                    <p class="text-sm">Belum ada data permintaan forklift.</p>
                </div>

            </div>

        </div>
    </div>

    <!-- Script JavaScript -->
    <script>
        let forkliftData = JSON.parse(localStorage.getItem('forkliftData')) || [];

        function saveData(e) {
            e.preventDefault();
            const editIndex = document.getElementById('editIndex').value;
            
            const newItem = {
                nama: document.getElementById('nama').value,
                section: document.getElementById('section').value,
                nomorMo: document.getElementById('nomorMo').value,
                deskripsi: document.getElementById('deskripsi').value,
                lokasi: document.getElementById('lokasi').value,
                tujuan: document.getElementById('tujuan').value,
                status: editIndex !== "" ? forkliftData[editIndex].status : 'Proses'
            };

            if (editIndex === "") {
                forkliftData.push(newItem);
            } else {
                forkliftData[editIndex] = newItem;
                resetForm();
            }

            localStorage.setItem('forkliftData', JSON.stringify(forkliftData));
            document.getElementById('forkliftForm').reset();
            renderTable();
        }

        function renderTable() {
            const tableBody = document.getElementById('tableData');
            const emptyState = document.getElementById('emptyState');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            const filterStatus = document.getElementById('filterStatus').value;

            tableBody.innerHTML = '';

            let filteredData = forkliftData.map((item, index) => ({ ...item, originalIndex: index })).filter(item => {
                const matchSearch = Object.values(item).some(val => 
                    String(val).toLowerCase().includes(searchKeyword)
                );
                const matchStatus = filterStatus === 'ALL' || item.status === filterStatus;
                return matchSearch && matchStatus;
            });

            // Update Statistik
            document.getElementById('stat-total').innerText = forkliftData.
